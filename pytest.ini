[pytest]
# Test configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Money-spending tests are OFF unless asked for by name. Until this line
# existed, the ONLY thing standing between a bare `pytest` and a live OpenAI
# bill was that both Make targets happen to enumerate their files by hand
# (F1). A CLI `-m live_openai` still overrides this, which is how the
# pre-merge eval is run deliberately.
addopts = -m "not live_openai"

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    live_openai: calls the REAL OpenAI model and spends money. Never in
        make test-unit or make test-bdd (neither target enumerates the file
        that carries it); run it deliberately, resampled, as the pre-merge
        gate for an extraction-prompt change
